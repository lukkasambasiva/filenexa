<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found – FileNexa</title>

    <meta name="description" content="The page you are looking for could not be found on FileNexa.">

    <link rel="stylesheet" href="style.css">

    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .error-box {
            max-width: 600px;
            width: 100%;
            padding: 45px 25px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 15px;
        }

        .error-box h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .error-box p {
            margin: 0 auto 25px;
            max-width: 480px;
            line-height: 1.6;
            color: #666;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            color: #fff;
            background: #2563eb;
        }

        .home-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 70px;
            }

            .error-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">
        <div class="error-box">

            <div class="error-code">404</div>

            <h1>Page Not Found</h1>

            <p>
                Sorry, the page you are looking for does not exist
                or may have been moved.
            </p>

            <a href="index.html" class="home-btn">
                ← Back to FileNexa
            </a>

        </div>
    </main>

</body>
</html>
